services:
  - type: web
    name: render4
    env: docker
    branch: main
    plan: starter
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        value: "RENDER_SECRET_KEY"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: ALLOWED_HOSTS
        value: "*"
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: libro-fiscal-db
          property: connectionString
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: libro-fiscal-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://libro-fiscal.onrender.com,https://www.libro-fiscal.onrender.com,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://libro-fiscal.onrender.com,https://www.libro-fiscal.onrender.com,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173"
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SAMESITE
        value: "None"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      # ── Email (Brevo SMTP) ──
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: BYPASS_EMAIL_VERIFICATION
        value: "mauricio1126@gmail.com,andresmau1126@gmail.com,mauro1126benelli@gmail.com,yo1126top76f@gmail.com,andresmau.colamericano7b@gmail.com,admin@test.com,usuario@test.com"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "Libro Fiscal"
      - key: ALERTA_EMAIL_DESTINO
        value: "maurcio1126@gmail.com"  # Destino de las alertas (ajusta según prefieras)
      - key: ENABLE_WHATSAPP_ALERTAS
        value: "true"
      - key: WHATSAPP_PHONE
        value: ""  # Número para WhatsApp (ej: 573XXXXXXXXX) - opcional
      - key: WHATSAPP_APIKEY
        value: ""  # API key de CallMeBot - opcional

databases:
  - name: libro-fiscal-db
    databaseName: libro_fiscal
    plan: starter

# Respaldo diario de PostgreSQL en almacenamiento S3 compatible.
jobs:
  - type: cron
    name: respaldo-postgres-diario
    env: docker
    branch: main
    plan: starter
    schedule: "30 7 * * *" # Render usa UTC.
    dockerfilePath: Dockerfile
    command: python manage.py respaldo_postgres --retention-days 30
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DATABASE_URL
        fromDatabase:
          name: libro-fiscal-db
          property: connectionString
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_REGION
        value: us-east-1
      - key: BACKUP_S3_ENDPOINT_URL
        sync: false
      - key: BACKUP_S3_PREFIX
        value: libro-fiscal

  # Job programado para enviar alertas diarias de inventario (vencimientos / bajo stock)
  - type: cron
    name: enviar-alertas-diarias
    env: docker
    branch: main
    plan: starter
    schedule: "0 7 * * *"  # Ejecuta diariamente a las 07:00 UTC (ajusta según tu zona)
    dockerfilePath: Dockerfile
    command: python manage.py enviar_alertas_multicanal --force-whatsapp
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        value: "RENDER_SECRET_KEY"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: libro-fiscal-db
          property: connectionString
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: libro-fiscal-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://libro-fiscal.onrender.com,https://www.libro-fiscal.onrender.com,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://libro-fiscal.onrender.com,https://www.libro-fiscal.onrender.com,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173"
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SAMESITE
        value: "None"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: BYPASS_EMAIL_VERIFICATION
        value: "mauricio1126@gmail.com,andresmau1126@gmail.com,mauro1126benelli@gmail.com,yo1126top76f@gmail.com,andresmau.colamericano7b@gmail.com,admin@test.com,usuario@test.com"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "Libro Fiscal"
      - key: ALERTA_EMAIL_DESTINO
        value: "maurcio1126@gmail.com"
      - key: WHATSAPP_PHONE
        value: ""  # Número para WhatsApp (ej: 573XXXXXXXXX) - opcional
      - key: WHATSAPP_APIKEY
        value: ""  # API key de CallMeBot - opcional
      - key: ENABLE_WHATSAPP_ALERTAS
        value: "true"
