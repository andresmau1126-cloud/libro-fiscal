services:
  - type: web
    name: render4
    env: docker
    branch: main
    plan: starter
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        value: "RENDER_SECRET_KEY"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: ALLOWED_HOSTS
        value: "*"
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: libro-fiscal-db
          property: connectionString
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: libro-fiscal-db
          property: connectionString
      # ── Email (Brevo SMTP) ──
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: ""  # Reemplaza con tu usuario de Brevo
      - key: EMAIL_HOST_PASSWORD
        value: ""  # Reemplaza con tu contraseña de Brevo
      - key: DEFAULT_FROM_EMAIL
        value: ""  # Reemplaza con tu email de Brevo
      - key: BREVO_SENDER_EMAIL
        value: ""  # Reemplaza con tu email de Brevo
      - key: BREVO_SENDER_NAME
        value: "Libro Fiscal"
      - key: ALERTA_EMAIL_DESTINO
        value: "maurcio1126@gmail.com"  # Destino de las alertas (ajusta según prefieras)
      - key: ENABLE_WHATSAPP_ALERTAS
        value: "true"
      - key: WHATSAPP_PHONE
        value: ""  # Número para WhatsApp (ej: 573XXXXXXXXX) - opcional
      - key: WHATSAPP_APIKEY
        value: ""  # API key de CallMeBot - opcional

databases:
  - type: postgres
    name: libro-fiscal-db
    databaseName: libro_fiscal
    plan: starter

# Job programado para enviar alertas diarias de inventario (vencimientos / bajo stock)
jobs:
  - type: cron
    name: enviar-alertas-diarias
    env: docker
    branch: main
    plan: starter
    schedule: "0 7 * * *"  # Ejecuta diariamente a las 07:00 UTC (ajusta según tu zona)
    dockerfilePath: Dockerfile
    command: python manage.py enviar_alertas_multicanal --force-whatsapp
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        value: "RENDER_SECRET_KEY"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: libro-fiscal-db
          property: connectionString
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: libro-fiscal-db
          property: connectionString
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: ""  # Reemplaza con tu usuario de Brevo
      - key: EMAIL_HOST_PASSWORD
        value: ""  # Reemplaza con tu contraseña de Brevo
      - key: DEFAULT_FROM_EMAIL
        value: ""  # Reemplaza con tu email de Brevo
      - key: BREVO_SENDER_EMAIL
        value: ""  # Reemplaza con tu email de Brevo
      - key: BREVO_SENDER_NAME
        value: "Libro Fiscal"
      - key: ALERTA_EMAIL_DESTINO
        value: "maurcio1126@gmail.com"
      - key: WHATSAPP_PHONE
        value: ""  # Número para WhatsApp (ej: 573XXXXXXXXX) - opcional
      - key: WHATSAPP_APIKEY
        value: ""  # API key de CallMeBot - opcional
      - key: ENABLE_WHATSAPP_ALERTAS
        value: "true"
