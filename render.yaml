services:
  - type: redis
    name: libro-fiscal-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: render4
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: ALLOWED_HOSTS
        value: libro-fiscal.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: libro-fiscal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: libro-fiscal-redis
          property: connectionString
      - key: CHANNEL_LAYER_BACKEND
        value: channels_redis.core.RedisChannelLayer
      - key: CORS_ALLOWED_ORIGINS
        value: https://libro-fiscal.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://libro-fiscal.onrender.com
      - key: SESSION_COOKIE_SAMESITE
        value: None
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SAMESITE
        value: None
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Libro Fiscal

databases:
  - name: libro-fiscal-db
    databaseName: libro_fiscal
    plan: starter
