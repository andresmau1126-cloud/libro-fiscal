services:
  - type: web
    name: render4
    env: docker
    branch: main
    plan: starter
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        value: "RENDER_SECRET_KEY"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: libro-fiscal-db
          property: DATABASE_URL
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: libro-fiscal-db
          property: DATABASE_URL
      # ── Email (Brevo SMTP) ──
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: ""  # Reemplaza con tu usuario de Brevo
      - key: EMAIL_HOST_PASSWORD
        value: ""  # Reemplaza con tu contraseña de Brevo
      - key: DEFAULT_FROM_EMAIL
        value: ""  # Reemplaza con tu email de Brevo
      - key: BREVO_SENDER_EMAIL
        value: ""  # Reemplaza con tu email de Brevo
      - key: BREVO_SENDER_NAME
        value: "Libro Fiscal"

databases:
  - type: postgres
    name: libro-fiscal-db
    databaseName: libro_fiscal
    plan: starter
