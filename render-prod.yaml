# render.yaml - Configuración automática para Render

# Este archivo configura todos los servicios necesarios para el sistema de inventario centralizado

services:
  # Cache/Session Storage con Redis
  - type: redis
    name: redis-libro-fiscal
    plan: standard
    maxmemoryPolicy: allkeys-lru
    
  # Web Service Django + WebSocket
  - type: web
    name: libro-fiscal-api
    env: python
    plan: standard
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      cd backend
      daphne -b 0.0.0.0 -p 10000 config.asgi:application
    
    # Enrutamiento web
    routes:
      - path: /
        matchType: prefix
      - path: /ws
        matchType: prefix
    
    # Variables de entorno
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: ALLOWED_HOSTS
        value: libro-fiscal.onrender.com
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-libro-fiscal
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis-libro-fiscal
          property: connectionString
      - key: CHANNEL_LAYER_BACKEND
        value: channels_redis.core.RedisChannelLayer
      - key: ASGI_APPLICATION
        value: config.asgi.application

databases:
  # Base de datos PostgreSQL persistente para productos, usuarios y movimientos.
  - name: postgres-libro-fiscal
    databaseName: libro_fiscal
    plan: standard
    ipAllowList: []